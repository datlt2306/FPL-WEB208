<table class="table table-bordered">
  <thead>
    <tr>
      <th>#</th>
      <th>Tên</th>
      <th>Giá</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of products; let i = index">
      <td>{{ i + 1 }}</td>
      <td>{{ item.name }}</td>
      <td>{{ item.price }}</td>
      <td>
        <button class="btn btn-primary">Cập nhật</button>
        <button class="btn btn-danger" (click)="removeItem(item.id!)">
          Xóa
        </button>
      </td>
    </tr>
  </tbody>
</table>

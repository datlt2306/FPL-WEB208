<table class="table table-borederd">
  <thead>
    <tr>
      <th>#</th>
      <th>Tên</th>
      <th>Giá</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of products; let i; as: index">
      <td>{{ i + 1 }}</td>
      <td>{{ item.name }}</td>
      <td>{{ item.price }}</td>
      <td>
        <button class="btn btn-danger">Xóa</button>
        <a href="/admin/products/edit/{{ item.id }}" class="btn btn-primary"
          >Sửa</a
        >
      </td>
    </tr>
  </tbody>
</table>
